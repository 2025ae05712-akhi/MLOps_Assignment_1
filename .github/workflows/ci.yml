name: MLOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Download dataset
        run: python data/download_data.py

      - name: Run unit tests
        run: pytest --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/junit.xml

  train:
    name: EDA and model training
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dataset
        run: python data/download_data.py

      - name: Run EDA
        run: python -m scripts.eda

      - name: Train and track experiments
        run: python -m src.train

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/

      - name: Upload reports and MLflow tracking data
        uses: actions/upload-artifact@v4
        with:
          name: reports-and-mlflow
          path: |
            reports/
            mlflow.db
            mlruns/
          if-no-files-found: warn

  docker:
    name: Build and smoke-test container
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: model
          path: models

      - name: Build image
        run: docker build -t heart-disease-api:${{ github.sha }} .

      - name: Start container
        run: docker run -d --name api -p 8000:8000 heart-disease-api:${{ github.sha }}

      - name: Smoke test endpoints
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":2,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}'
          curl -sf http://localhost:8000/metrics | grep api_requests_total

      - name: Show container logs
        if: always()
        run: docker logs api

      - name: Stop container
        if: always()
        run: docker rm -f api

  publish:
    name: Publish image to GHCR
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: model
          path: models

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
